packages:
  - "."

# Pacotes autorizados a rodar scripts de instalação.
# `allowBuilds` vale para o pnpm 11+; `onlyBuiltDependencies`, para o pnpm 10.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - sharp
  - unrs-resolver
